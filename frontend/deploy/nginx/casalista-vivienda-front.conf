# Nginx — frontend SPA (Vite build) en vivienda.colsubsidio.vanvar.tech
#
# Requisitos previos en el VPS:
#   1) Repo en /opt/reto-vivienda-colsubsidio/Hackathon-Vanvar
#   2) Crear frontend/.env.production con:
#        VITE_API_BASE_URL=https://api.vivienda.colsubsidio.vanvar.tech
#   3) cd frontend && npm ci && npm run build
#      → genera /opt/reto-vivienda-colsubsidio/Hackathon-Vanvar/frontend/dist
#
# Puerto de servicio HTTP: 5000 (+ 80 para ACME/Certbot).
# SSL:
#   sudo certbot --nginx -d vivienda.colsubsidio.vanvar.tech
#
# Activar:
#   sudo cp frontend/deploy/nginx/casalista-vivienda-front.conf /etc/nginx/sites-available/casalista-vivienda-front
#   sudo ln -sf /etc/nginx/sites-available/casalista-vivienda-front /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 5000;
    listen [::]:5000;
    listen 80;
    listen [::]:80;
    server_name vivienda.colsubsidio.vanvar.tech;

    server_tokens off;
    root /opt/reto-vivienda-colsubsidio/Hackathon-Vanvar/frontend/dist;
    index index.html;

    access_log /var/log/nginx/casalista_vivienda_front_access.log;
    error_log  /var/log/nginx/casalista_vivienda_front_error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Assets con hash de Vite: cache largo
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
