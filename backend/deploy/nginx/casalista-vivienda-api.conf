# Nginx reverse proxy → CasaLista Voice API (Gunicorn) en 127.0.0.1:8100
# Dominio: api.vivienda.colsubsidio.vanvar.tech
#
# IMPORTANTE: este archivo es solo HTTP. El bloque SSL lo agrega Certbot:
#   sudo certbot --nginx -d api.vivienda.colsubsidio.vanvar.tech
#
# Activar:
#   sudo cp backend/deploy/nginx/casalista-vivienda-api.conf /etc/nginx/sites-available/casalista-vivienda-api
#   sudo ln -sf /etc/nginx/sites-available/casalista-vivienda-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream casalista_vivienda_api {
    server 127.0.0.1:8100;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.vivienda.colsubsidio.vanvar.tech;

    server_tokens off;
    client_max_body_size 25M;

    access_log /var/log/nginx/casalista_vivienda_api_access.log;
    error_log  /var/log/nginx/casalista_vivienda_api_error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json text/plain application/javascript text/css;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # API REST + Twilio webhooks bajo /api/v1 (CORS lo responde FastAPI)
    location /api/ {
        proxy_pass http://casalista_vivienda_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Twilio ConversationRelay WebSocket (conexiones largas)
    location /api/v1/twilio/conversation-relay {
        proxy_pass http://casalista_vivienda_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    location = /health {
        proxy_pass http://casalista_vivienda_api/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://casalista_vivienda_api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://casalista_vivienda_api/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
