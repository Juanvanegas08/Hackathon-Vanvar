# Referencia de despliegue (Docker / Podman) — puerto 8100
#
# Build:
#   cd backend
#   docker build -t casalista-voice-api:latest .
#
# Run (host network, típico VPS):
#   docker run -d --name casalista-voice-api --network host --restart unless-stopped \
#     -v /etc/localtime:/etc/localtime:ro \
#     -v /opt/casalista/secrets/.env:/app/.env:ro \
#     -v /opt/casalista/data/processed:/app/data/processed:ro \
#     -e APP_ENV=production -e GUNICORN_BIND=127.0.0.1:8100 -e RUN_MIGRATIONS=1 \
#     casalista-voice-api:latest
#
# Nginx (api.vivienda.colsubsidio.vanvar.tech) → 127.0.0.1:8100

services:
  api:
    image: ${IMAGE_NAME:-casalista-voice-api}:${IMAGE_TAG:-latest}
    container_name: casalista-voice-api
    restart: unless-stopped
    network_mode: host
    environment:
      APP_ENV: production
      ENVIRONMENT: production
      GUNICORN_BIND: "127.0.0.1:8100"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${ENV_FILE:-/opt/casalista/secrets/.env}:/app/.env:ro
      - ${PROCESSED_DATA:-/opt/casalista/data/processed}:/app/data/processed:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
